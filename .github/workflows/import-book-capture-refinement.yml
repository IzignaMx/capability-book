name: Import reviewed Distrito Cero captures
on:
  push:
    branches: [redesign/book-atlas-pages]
    paths: [.github/workflows/import-book-capture-refinement.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'IzignaMx/capability-book' && github.ref == 'refs/heads/redesign/book-atlas-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/book-atlas-pages
          fetch-depth: 0
      - name: Retrieve exact reviewed capture package
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/book-captures.zip" 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/7f249b01-4b27-4f6c-bc7a-c6d5cc7ca0b2.zip'
          echo "e827c80c6f367edce0e6d1c4093d67efeecd28ae957f6b65ba7bfe1361a4f68d  $RUNNER_TEMP/book-captures.zip" | sha256sum --check
      - name: Validate paths, previous files and payload hashes
        run: |
          python3 - <<'PY'
          import os,json,hashlib,zipfile,subprocess
          from pathlib import Path,PurePosixPath
          root=Path.cwd().resolve();review=Path(os.environ['RUNNER_TEMP'])/'book-capture-review'
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'book-captures.zip') as z:
              m=json.loads(z.read('manifest.json'))
              assert m['repository']=='IzignaMx/capability-book' and m['branch']=='redesign/book-atlas-pages'
              assert m['base']=='589d25f3797a77479f55e68f59cf5c0ef9325c18'
              subprocess.run(['git','merge-base','--is-ancestor',m['base'],'HEAD'],check=True)
              assert len(m['files'])==8 and len(m['review'])==6
              expected={'manifest.json'}|{'files/'+f['path'] for f in m['files']}|{'review/'+f['path'] for f in m['review']}
              assert set(z.namelist())==expected and len(z.namelist())==len(expected)
              assert sum(i.file_size for i in z.infolist())<12000000
              changes=[]
              for e in m['files']:
                  rel=PurePosixPath(e['path']);assert not rel.is_absolute() and '..' not in rel.parts
                  assert rel.parts[0] in ['atlas','docs','public']
                  dest=root.joinpath(*rel.parts);assert dest.resolve().is_relative_to(root) and not dest.is_symlink()
                  assert dest.is_file() and hashlib.sha256(dest.read_bytes()).hexdigest()==e['previous_sha256'],str(rel)+' changed'
                  data=z.read('files/'+str(rel));assert hashlib.sha256(data).hexdigest()==e['sha256']
                  changes.append((dest,data,str(rel)))
              review.mkdir(parents=True,exist_ok=True)
              for e in m['review']:
                  rel=PurePosixPath(e['path']);assert len(rel.parts)==1 and rel.suffix=='.png'
                  data=z.read('review/'+str(rel));assert hashlib.sha256(data).hexdigest()==e['sha256']
                  (review/str(rel)).write_bytes(data)
              (review/'manifest.json').write_text(json.dumps(m['review'],indent=2))
              for dest,data,rel in changes:dest.write_bytes(data)
              subprocess.run(['git','add','--']+[rel for _,_,rel in changes],check=True)
          print('Eight reviewed capture/content files imported; six visual review images exported. Main unchanged.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: book-game-captures-final-review
          path: ${{ runner.temp }}/book-capture-review
          if-no-files-found: error
      - name: Save only the current review branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use real Distrito Cero captures after dismissing tutorial overlay'
          git push origin HEAD:refs/heads/redesign/book-atlas-pages
