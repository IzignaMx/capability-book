name: Import final Book game captures
on:
  push:
    branches: [redesign/book-atlas-pages]
    paths: [.github/workflows/import-book-capture-polish.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'IzignaMx/capability-book' && github.ref == 'refs/heads/redesign/book-atlas-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/book-atlas-pages
          fetch-depth: 0
      - name: Retrieve fixed capture refinements
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/book-games.zip" 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Icvp3WfrHKY6QGnlXqcYgbAGfb/279acc23-80ab-4d9a-b871-6059c0042ccd.zip'
          echo "f0931f3e76b847eb3f642a0b42330dd500bdadb933fe950d30d36fc573a3d8e5  $RUNNER_TEMP/book-games.zip" | sha256sum --check
      - name: Verify all source and visual file hashes
        run: |
          python3 - <<'PY'
          import os,json,hashlib,zipfile,subprocess
          from pathlib import Path, PurePosixPath
          root=Path.cwd().resolve()
          review=Path(os.environ['RUNNER_TEMP'])/'book-games-visuals'
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'book-games.zip') as z:
              m=json.loads(z.read('manifest.json'))
              assert m['repository']=='IzignaMx/capability-book'
              assert m['branch']=='redesign/book-atlas-pages'
              assert m['base']=='8752639fc90600107eb21777efaedbf29c00b14d'
              subprocess.run(['git','merge-base','--is-ancestor',m['base'],'HEAD'],check=True)
              assert len(m['files'])==9 and len(m['review'])==8
              expected={'manifest.json'}|{'files/'+f['path'] for f in m['files']}|{'review/'+f['path'] for f in m['review']}
              assert set(z.namelist())==expected and len(z.namelist())==len(expected)
              assert sum(i.file_size for i in z.infolist())<20000000
              prepared=[]
              for entry in m['files']:
                  rel=PurePosixPath(entry['path'])
                  assert not rel.is_absolute() and '..' not in rel.parts
                  assert rel.parts[0] in ['atlas','docs','public']
                  assert rel.suffix not in ['.woff','.woff2','.otf','.ttf']
                  dest=root.joinpath(*rel.parts)
                  assert dest.resolve().is_relative_to(root) and not dest.is_symlink()
                  previous=subprocess.run(['git','cat-file','blob',m['base']+':'+str(rel)],capture_output=True,check=True).stdout
                  assert hashlib.sha256(previous).hexdigest()==entry['previous_sha256']
                  assert dest.is_file() and hashlib.sha256(dest.read_bytes()).hexdigest()==entry['previous_sha256'], str(rel)+' changed'
                  data=z.read('files/'+str(rel))
                  assert hashlib.sha256(data).hexdigest()==entry['sha256']
                  prepared.append((dest,data,str(rel)))
              review.mkdir(parents=True,exist_ok=True)
              for entry in m['review']:
                  rel=PurePosixPath(entry['path'])
                  assert len(rel.parts)==1 and rel.suffix=='.png'
                  data=z.read('review/'+str(rel))
                  assert hashlib.sha256(data).hexdigest()==entry['sha256']
                  (review/str(rel)).write_bytes(data)
              (review/'manifest.json').write_text(json.dumps(m['review'],indent=2))
              for dest,data,rel in prepared:
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
              subprocess.run(['git','add','--']+[rel for _,_,rel in prepared],check=True)
          print('Verified nine refinements and eight final review images.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: book-games-final-visuals
          path: ${{ runner.temp }}/book-games-visuals
          if-no-files-found: error
      - name: Save only to the review branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: show unobstructed actual Distrito Cero gameplay in portfolio captures'
          git push origin HEAD:refs/heads/redesign/book-atlas-pages
