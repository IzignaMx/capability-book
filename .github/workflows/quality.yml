name: quality and pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    env:
      ATLAS_INDEXABLE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Book CDN delivery offline
        run: python3 -B .github/scripts/test_book_cdn.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:evidence
      - run: pnpm check
      - run: pnpm build
      - run: python3 scripts/verify-atlas-manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-dist
          path: dist
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-build-validation
          path: |
            docs/atlas/static-validation.json
            docs/atlas/art-budgets.json
  e2e:
    name: e2e
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: atlas-dist
          path: dist
      - run: python3 scripts/verify-atlas-manifest.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:atlas
      - run: python3 scripts/verify-atlas-manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-checks
          path: |
            docs/atlas/browser-summary.json
            docs/book-*-checks.json
  accessibility:
    name: accessibility
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: atlas-dist
          path: dist
      - run: python3 scripts/verify-atlas-manifest.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify-atlas-a11y-readiness.cjs
      - run: pnpm test:a11y:atlas
      - run: python3 scripts/verify-atlas-manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-accessibility-checks
          path: audit/atlas-accessibility/
  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, e2e, accessibility]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Cloudflare configuration without displaying credentials
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/book_cdn.py --check-config
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Invalidate only book.izignamx.com in Cloudflare
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/book_cdn.py
      - name: Verify the ordinary production release after invalidation
        run: python3 .github/scripts/book_cdn.py --verify-release
